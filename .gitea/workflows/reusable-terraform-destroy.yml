name: "Reusable Terraform Destroy"

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment name (e.g., dev, prod)"
        required: true
        type: string
      vm_name:
        description: "VM name (e.g., dev01, prod01)"
        required: true
        type: string
      confirm_destroy:
        description: "Type 'yes' to confirm destroy"
        required: false
        type: string
        default: ""
      terraform_version:
        description: "Optional Terraform version (defaults to latest)"
        required: false
        type: string
        default: ""
    secrets:
      # MINIO_ENDPOINT:
      #   required: true
      # MINIO_ACCESS_KEY:
      #   required: true
      # MINIO_SECRET_KEY:
      #   required: true
      S3_ENDPOINT:
        required: true
      S3_ACCESS_KEY:
        required: true
      S3_SECRET_KEY:
        required: true
      LXD_ADDRESS:
        required: true
      ANSIBLE_SSH_PUBLIC_KEY:
        required: true
      LXD_TRUST_PASSWORD:
        required: false # -- true if using password auth instead of certs, but certs are recommended for security --
      LXD_CLIENT_CERT:
        required: true # -- false if using password auth instead of certs, but certs are recommended for security --
      LXD_CLIENT_KEY:
        required: true # -- false if using password auth instead of certs, but certs are recommended for security --

jobs:
  destroy:
    runs-on: ubuntu-latest
    # S3 credentials for the SeaweedFS backend. Terraform reads these from the
    # environment, so they are available to both `init` and `plan` and are never
    # written into .terraform/ on disk.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Safety Check (Hard Gate)
      # -------------------------------------------------------------------
      - name: Confirm Destroy
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "yes" ]; then
            echo "::error:: Destroy not confirmed. Type 'yes' to proceed."
            exit 1
          fi

      # -------------------------------------------------------------------
      # Set + Validate Variables
      # -------------------------------------------------------------------
      - name: Set Variables
        id: vars
        run: |
          ENV=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          VM="${{ inputs.vm_name }}"

          if [ "$ENV" != "dev" ] && [ "$ENV" != "prod" ]; then
            echo "::error:: Invalid environment: $ENV (allowed: dev, prod)"
            exit 1
          fi

          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "vm_name=$VM" >> $GITHUB_OUTPUT
          echo "working_dir=terraform/env/${ENV}" >> $GITHUB_OUTPUT
          echo "tfvars_file=${VM}.tfvars" >> $GITHUB_OUTPUT
          echo "state_key=state/${ENV}/${VM}/terraform.tfstate" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------
      # Validate tfvars exists
      # -------------------------------------------------------------------
      - name: Validate tfvars exists
        working-directory: ${{ steps.vars.outputs.working_dir }}
        run: |
          FILE="${{ steps.vars.outputs.tfvars_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error:: tfvars file not found: $FILE"
            exit 1
          fi

      # -------------------------------------------------------------------
      # Setup Terraform
      # -------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      # -------------------------------------------------------------------
      # Setup LXD certificates (optional if using password auth, but recommended for security)
      # Provider will automatically pick up certs from ~/.config/lxc/ if they exist, defined in workflow secrets LXD_CLIENT_CERT and LXD_CLIENT_KEY
      # -------------------------------------------------------------------
      - name: Setup LXD Certs
        if: ${{ secrets.LXD_CLIENT_CERT != '' && secrets.LXD_CLIENT_KEY != '' }}
        run: |
          mkdir -p ~/.config/lxc
          printf "%s" "${{ secrets.LXD_CLIENT_CERT }}" > ~/.config/lxc/client.crt
          printf "%s" "${{ secrets.LXD_CLIENT_KEY }}"  > ~/.config/lxc/client.key
          chmod 600 ~/.config/lxc/client.key

      # -------------------------------------------------------------------
      # Init (S3 backend on SeaweedFS)
      # Non-secret settings go in a generated backend.hcl file. The access and
      # secret keys come from the job-level AWS_* environment variables.
      # -------------------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ steps.vars.outputs.working_dir }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "tfstate"
          key    = "${{ steps.vars.outputs.state_key }}"
          region = "us-east-1"

          endpoints = { s3 = "${S3_ENDPOINT}" }

          use_path_style              = true
          use_lockfile                = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_s3_checksum            = true
          EOF

          terraform init -backend-config=backend.hcl

      # -------------------------------------------------------------------
      # Terraform Destroy
      # -------------------------------------------------------------------
      - name: Terraform Destroy
        working-directory: ${{ steps.vars.outputs.working_dir }}
        env:
          TF_VAR_lxd_address: ${{ secrets.LXD_ADDRESS }}
          TF_VAR_ansible_ssh_public_key: ${{ secrets.ANSIBLE_SSH_PUBLIC_KEY }}
          #TF_VAR_lxd_trust_password: ${{ secrets.LXD_TRUST_PASSWORD }} # -- IGNORE if using lxd certificate --
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_vm_name: ${{ inputs.vm_name }}
        run: |
          terraform destroy -auto-approve \
            -var-file="${{ steps.vars.outputs.tfvars_file }}"
